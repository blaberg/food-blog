name: Deploy to GitHub Pages
on:
  push:
    branches:
      - master
    paths:
      - cmd/**
      - recipes/**
      - go.mod
      - go.sum
      - package.json
      - package-lock.json
      - .github/workflows/deploy.yaml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: build
        run: go run ./cmd/generator
      - name: Upload static files as artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
